# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
course_name: Natural Language Processing
course_code: E1282
# central_ref: <40-character commit SHA>   # OPTIONAL: pin this course to one known
#   # commit of the central toolkit - the way to hold a course still, or back, while
#   # something is fixed. Unset means `release`, which is where every real course belongs.
#   # (`main` is the trunk and is also accepted, but only the demo course runs it: an org
#   # on `main` takes every merge the moment it lands. `preview` is a PR tip the maintainer
#   # force-pushes, for looking at a feature before it merges - the demo course and nothing
#   # else.) Cohorts inherit this; setting it in a cohort's own file does nothing.
# course_description: One or two sentences, on ONE line - the blurb on every cohort site.
# site_link_extensions: [pdf, html, ipynb]   # OPTIONAL: on the COHORT sites, link ONLY
#   # these file types. Default (unset): each session's root files, plus one link per
#   # subfolder - so a rendered deck lists the deck, not its hundreds of assets. Either way
#   # everything you release still ships, and the folder itself is always one click away.
#   # (The public open-courseware site always lists root files - it hosts what it lists.)
#   # WHICH of those files the cohort site hosts publicly, so an HTML deck opens rendered
#   # instead of showing as source, is `publish.yml` in the materials repo - not here.

# What every assignment under this course starts from. **New assignment** stamps these
# values into the `grading_config.yml` it generates, so each assignment's own file says
# what it does and can be edited there afterwards; changing them here changes the NEXT
# assignment, never one that already exists. The two late-work lines are the toolkit's
# own default, applied when they are absent here and from the assignment too.
# One or two sentences, on ONE line - the blurb on every cohort site. Taken verbatim
# from the Course Contents section of SYLLABUS.md in course-materials-f2026.
course_description: "The course provides a conceptual and applied introduction to Natural Language processing (NLP). The program introduces NLP within the broader fields of Machine Learning and Deep Learning. It will cover core topics such as text representation, text preprocessing, supervised and unsupervised learning with labeled and unlabeled datasets, model evaluations, and emerging trends including using other data sources such as audio and video."

# `course_name`, `course_code` and `course_description` are what reach the cohort
# websites. Editing them here re-syncs every cohort site already bootstrapped from this
# course org.
#
# This is the persistent COURSE org - it spans many cohorts (years). Cohorts are
# registered separately in .github/cohort-courses-pages.yml.

# Set by `--central-ref` at bootstrap - see the commented note above.
central_ref: main

# ---------------------------------------------------------------------------
# People. Two DIFFERENT things live under the `people:` key below - don't
# confuse them:
#
#   course_admins        GRANTS ACCESS. The single source of truth for course-wide
#                        admin rights - the `course-admin` team here, mirrored into
#                        every cohort org. A handle added any other way is reverted
#                        on the next sync unless it's declared here; removing a
#                        handle here revokes their access.
#
#   instructors          DISPLAY ONLY - website cards (name/photo/title/link) for
#                        the OPTIONAL public open-courseware course website (the
#                        "Publish course website" action). They grant NO GitHub
#                        access. TAs are NOT declared here - they change every
#                        cohort, so a cohort's whole teaching team (instructors &
#                        TAs, their GitHub access AND their cohort-site cards) is
#                        declared PER COHORT in that cohort's classroom-config/people.yml.
# ---------------------------------------------------------------------------
people:
  course_admins:
    - github_handle: "henrycgbaker"    # grants the `course-admin` team

  # Instructor website cards (optional, DISPLAY ONLY - no GitHub access) for the
  # OPTIONAL public open-courseware course website. TAs are NOT listed here - a
  # cohort's own teaching team (instructors & TAs) goes in that cohort's
  # classroom-config/people.yml instead. Uncomment and fill:
  # instructors:
  #   - github_handle: "janedoe"
  #     name:  "Prof. Dr. Jane Doe"
  #     title: "Professor of Data Science"
  #     photo: "/_images/pp/jane.jpg"             # square image: EITHER a path to a
  #                                               # file committed into the site repo
  #                                               # under _images/pp/, OR an absolute
  #                                               # URL on a host that allows
  #                                               # hotlinking (e.g. a GitHub avatar
  #                                               # link - many institutional sites
  #                                               # 403 off-site requests instead)
  #     url:   "https://.../profile/jane-doe"     # bio / profile link
