name: Temp accept semester invites
on: workflow_dispatch
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
        run: |
          for o in DELETE-nlp-f2026 DELETE-maths-f2026; do
            gh api -X PATCH user/memberships/orgs/$o -f state=active --jq '.organization.login+" "+.state+"/"+.role'
          done
